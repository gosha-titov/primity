excluded:
  - .build
  - DerivedData
  - Package.swift
  
disabled_rules:
  - no_magic_numbers
  - one_declaration_per_file
  - type_name
  - force_cast
  - force_try
  - force_unwrapping
  - redundant_self
  - trailing_comma
  - unneeded_synthesized_initializer
  
analyzer_rules:
  - unused_import
  - unused_declaration
  - typesafe_array_init

opt_in_rules:
  - file_name_no_space
  - file_types_order
  - type_contents_order
  
  - convenience_type
  - implicitly_unwrapped_optional
  - prefer_type_checking
  - untyped_error_in_catch
  - weak_delegate
  - class_delegate_protocol
  - overridden_super_call
  - prohibited_super_call
  - unneeded_override
  - override_in_extension
  
  - superfluous_else
  - direct_return
  - implicit_getter
  - discouraged_default_parameter
  - large_tuple
  - closure_body_length
  
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - identical_operands
  - unowned_variable_capture
  - async_without_await
  - unhandled_throwing_task
  - redundant_type_annotation
  - redundant_void_return
  - void_return
  - void_function_in_ternary
  - redundant_nil_coalescing
  - redundant_discardable_let
  - redundant_set_access_control
  - redundant_sendable
  
  - todo
  - expiring_todo
  - mark
  
  - explicit_acl
  - explicit_top_level_acl
  - lower_acl_than_parent
  - private_over_fileprivate
  - strict_fileprivate
  - no_extension_access_modifier
  - private_swiftui_state
  - private_subject
  - private_action
  - private_outlet
  
  - sorted_imports
  - duplicate_imports

  - generic_type_name
  - enum_case_associated_values_count
  - discouraged_none_name
  - raw_value_for_camel_cased_codable_enum
  
  - closing_brace
  - closure_end_indentation
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_call_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - collection_alignment
  - switch_case_alignment
  - switch_case_on_newline
  - vertical_whitespace_between_cases
  - closure_parameter_position
  - closure_spacing
  - anonymous_argument_in_multiline_closure
  - multiple_closures_with_trailing_closure
  - trailing_closure
  - empty_parentheses_with_trailing_closure
  - period_spacing
  - comma_inheritance
  - function_name_whitespace
  - no_space_in_method_call
  - attribute_name_spacing
  - number_separator
  - trailing_comma
  
  - syntactic_sugar
  - explicit_init
  - empty_count
  - empty_string
  - empty_collection_literal
  - empty_enum_arguments
  - empty_parameters
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - first_where
  - last_where
  - for_where
  - reduce_into
  - reduce_boolean
  - is_disjoint
  - toggle_bool
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - array_init
  - optional_enum_case_matching
  - pattern_matching_keywords
  - yoda_condition
  - fallthrough
  - no_fallthrough_only
  - unneeded_break_in_switch
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - sorted_enum_cases
  - sorted_first_last
  - shorthand_optional_binding
  - unused_optional_binding
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_setter_value
  - unused_parameter
  - self_binding
  - superfluous_disable_command
  - blanket_disable_command
  - invalid_swiftlint_command
  - unavailable_condition
  - unavailable_function
  - fatal_error_message
  - discouraged_assert
  - no_empty_block
  - unneeded_escaping
  - unneeded_throws_rethrows
  - return_value_from_void_function
  - computed_accessors_order
  - protocol_property_accessors_order
  - modifier_order
  - attributes
  - dynamic_inline
  - implicit_optional_initialization
  
  - private_unit_test
  - single_test_class
  - final_test_case
  - empty_xctest_method
  - xctfail_message
  - balanced_xctest_lifecycle
  - test_case_accessibility

vertical_whitespace:
  max_empty_lines: 2

line_length:
  warning: 200
  error: 200
  
file_length:
  warning: 300
  error: 500
  
type_body_length:
  warning: 150
  error: 250
  
function_body_length:
  warning: 16
  error: 30
  
closure_body_length:
  warning: 16
  error: 30
  
function_parameter_count:
  warning: 3
  error: 5
  
cyclomatic_complexity:
  warning: 5
  error: 10
  
identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - z
    - up
    - on
    - at
    - in
    - to

type_contents_order:
  order:
    - [type_alias, associated_type]
    - [subtype]
    - [case]
    - [type_property]
    - [instance_property]
    - [ib_inspectable]
    - [ib_outlet]
    - [type_method]
    - [view_life_cycle_method]
    - [ib_action, ib_segue_action]
    - [other_method]
    - [subscript]
    - [initializer]
    - [deinitializer]

expiring_todo:
  date_format: "yyyy-MM-dd"
  date_separator: "-"
  
file_types_order:
  order:
    - main_type
    - supporting_type

custom_rules:
    
  no_period_in_error_messages:
    name: "No Trailing Period in Messages"
    regex: '(fatalError|preconditionFailure|assertionFailure|XCTFail)\(\s*"[^"]*[.!]"'
    message: "One sentence, no trailing period."
    severity: warning

  no_print:
    name: "No print()"
    regex: '\bprint\('
    match_kinds:
      - identifier
    message: "Use a real logger, not print()."
    severity: warning
